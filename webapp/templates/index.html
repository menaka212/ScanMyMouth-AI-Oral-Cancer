<!DOCTYPE html>
<html>
<head>
    <title>Oral Cancer Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding-top: 40px;
        }
        .card {
            background: white;
            width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.15);
            text-align: left;
        }
        h2 {
            text-align: center;
        }
        .row {
            margin: 10px 0;
            font-size: 16px;
        }
        .label {
            font-weight: bold;
        }
        .high { color: red; }
        .medium { color: orange; }
        .low { color: green; }
        img {
            display: block;
            margin: 15px auto;
            width: 300px;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Oral Cancer Detection</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="image" required>
        <br><br>
        <button type="submit">Analyze</button>
    </form>

    {% if result %}
        <hr>
        <div class="row"><span class="label">Uploaded Image:</span> {{ image_name }}</div>
        <div class="row"><span class="label">AI Prediction:</span> {{ result }}</div>
        <div class="row"><span class="label">Confidence Score:</span> {{ confidence }}%</div>

        <div class="row">
            <span class="label">Risk Level:</span>
            <span class="{{ risk|lower }}">{{ risk }}</span>
        </div>

        <div class="row"><span class="label">Heatmap Generated:</span> YES</div>

       <img src="{{ heatmap_url }}" width="300">

    {% endif %}
</div>

</body>
</html>
